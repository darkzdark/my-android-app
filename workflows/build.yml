name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyinstaller opencv-python numpy pillow matplotlib ttkbootstrap scikit-image

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name "ImageEnhancer" image_enhancer_final.py

      - name: Upload EXE
        uses: actions/upload-artifact@v3
        with:
          name: ImageEnhancer-Windows
          path: dist/ImageEnhancer.exe
